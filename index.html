<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackMaria — Neon Sprint</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <canvas id="game" aria-label="Racingspill"></canvas>
    <section class="hud">
      <div class="brand"><span class="dot"></span> TRACKMARIA <small>NEON SPRINT</small></div>
      <div class="stats">
        <div><span>TID</span><strong id="time">00:00.000</strong></div>
        <div><span>BESTE</span><strong id="best">--:--.---</strong></div>
        <div><span>RUNDE</span><strong id="lap">1 / 3</strong></div>
      </div>
      <div class="help">PILOTER MED <b>← →</b> <i>eller</i> <b>A D</b><br><span>SPACE</span> boost · <span>R</span> restart</div>
    </section>
    <section class="result" id="result" hidden>
      <p>RUN FULLFØRT</p><h1 id="finalTime">00:00.000</h1><button id="restart">KJØR IGJEN</button>
    </section>
    <div class="countdown" id="countdown">3</div>
  </main>
  <script src="game.js"></script>
</body>
</html>
